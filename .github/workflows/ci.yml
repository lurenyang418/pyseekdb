name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - 'README.md'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: '3.11'
          dependency-group: dev

      - name: Check GitHub Actions workflows
        uses: raven-actions/actionlint@v2

      - name: Run checks
        run: |
          set -euo pipefail
          uv lock --locked
          uv run ruff check .
          uv run ruff format --check .

          if git grep -nI -E '^(<<<<<<<|=======|>>>>>>>)($|[[:space:]])' -- .; then
            echo "Merge conflict marker found"
            exit 1
          fi

          if git grep -nI -E '[[:blank:]]$' -- .; then
            echo "Trailing whitespace found"
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: '3.11'
          dependency-group: none

      - name: Build package
        run: uv build

      - name: Verify build artifacts
        run: |
          ls -la dist/
          # Verify both sdist and wheel are created
          test -f dist/*.tar.gz || (echo "Source distribution not found" && exit 1)
          test -f dist/*.whl || (echo "Wheel not found" && exit 1)

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  fast-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}
          dependency-group: dev

      - name: Run unit tests
        run: |
          if [ "${{ env.RUNNER_DEBUG }}" = "true" ]; then
            log_level=DEBUG
          else
            log_level=INFO
          fi
          uv run pytest tests/unit_tests/ -v --log-cli-level=${log_level}

      - name: Run no-server integration tests
        run: |
          if [ "${{ env.RUNNER_DEBUG }}" = "true" ]; then
            log_level=DEBUG
          else
            log_level=INFO
          fi
          uv run pytest tests/integration_tests/ -v --log-cli-level=${log_level} \
            -k "not server and not oceanbase"

  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false  # Allow other jobs to continue if one fails
      matrix:
        include:
          - test_mode: server
          - test_mode: oceanbase

    steps:
      - name: Free disk space
        uses: kfir4444/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: '3.11'
          dependency-group: dev

      - name: Start OceanBase container
        if: matrix.test_mode == 'oceanbase'
        uses: oceanbase/setup-oceanbase-ce@v1
        with:
          image_name: 'oceanbase/oceanbase-ce'
          image_tag: '4.5.0.0-100000012025112711'
          mode: 'mini'
          sql_port: 10000
          datafile_size: '20G'
          log_disk_size: '10G'
          tenant_name: 'mysql'
          init_sql: "ALTER SYSTEM ob_vector_memory_limit_percentage = 30;"

      - name: Start seekdb server container
        if: matrix.test_mode == 'server'
        run: |
          docker run --name seekdb-server -p 2881:2881 -d oceanbase/seekdb:1.0.0.0-100000262025111218
          for attempt in {1..30}; do
            if (echo > /dev/tcp/127.0.0.1/2881) 2>/dev/null; then
              echo "seekdb server ready after ${attempt} attempt(s)"
              docker logs seekdb-server
              exit 0
            fi

            if [[ "$(docker inspect --format='{{.State.Running}}' seekdb-server 2>/dev/null)" != "true" ]]; then
              echo "seekdb server container stopped before becoming ready" >&2
              docker logs seekdb-server
              exit 1
            fi
            sleep 2
          done

          docker logs seekdb-server
          echo "seekdb server did not become ready within 60 seconds" >&2
          exit 1

      - name: Run integration tests for ${{ matrix.test_mode }}
        env:
          CI: 1
          OB_PORT: 10000
          OB_USER: root
          OB_PASSWORD: ''
          SERVER_PORT: 2881
        run: |
          # Run integration tests filtered by test mode
          if [ "${{ env.RUNNER_DEBUG }}" = "true" ]; then
            log_level=DEBUG
          else
            log_level=INFO
          fi
          uv run pytest tests/integration_tests/ -v --log-cli-level=${log_level} \
            -k "${{ matrix.test_mode }}"
