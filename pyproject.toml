[project]
name = "pyseekdb"
version = "2.0.0"
description = "Python SDK for seekdb Server and OceanBase Server (pymysql-based). Supports vector, full-text, and hybrid search with a pluggable EmbeddingFunction protocol."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "OceanBase", email = "open_oceanbase@oceanbase.com" }]
requires-python = ">=3.11,<4"
classifiers = [
    "Development Status :: 4 - Beta",
]
dependencies = [
    "pymysql>=1.2.0",
]

[project.urls]
Homepage = "https://www.seekdb.ai/"
Repository = "https://github.com/oceanbase/pyseekdb/"
"Bug Tracker" = "https://github.com/oceanbase/pyseekdb/issues"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
docs = [
    "furo>=2025.12.19; python_version >= '3.12'",
    "myst-parser>=5.1; python_version >= '3.12'",
    "sphinx>=9.1,<10; python_version >= '3.12'",
]

[tool.uv]
required-version = ">=0.12.9,<0.13"

[tool.hatch.build.targets.sdist]
exclude = [
    ".claude",
    ".github",
    "dist",
    "docs/_build",
    "tmp",
    "uv.lock",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pyseekdb"]

[tool.pytest.ini_options]
log_level = "INFO"

[tool.ruff]
target-version = "py311"
line-length = 120
fix = true
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-debugger
    "T10",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # mccabe
    "C90",
    # pycodestyle
    "E", "W",
    # pyflakes
    "F",
    # pygrep-hooks
    "PGH",
    # pyupgrade
    "UP",
    # ruff
    "RUF",
    # tryceratops
    "TRY",
]
ignore = [
    # LineTooLong
    "E501",
    # DoNotAssignLambda
    "E731",
    # Long exception message
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S608", "C901", "S105", "S110", "TRY300", "B017"]
"src/pyseekdb/client/client_base.py" = ["S608", "C901"]
"src/pyseekdb/client/document_query_builder.py" = ["C901"]

[tool.ruff.format]
preview = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
